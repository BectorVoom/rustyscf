[package]
name = "rustyscf"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust + cubecl port of PySCF PBC band-structure calculations (HF + GTH + FFTDF, 3D)."
license = "MIT OR Apache-2.0"
readme = "README.md"
categories = ["science", "simulation"]
keywords = ["quantum-chemistry", "pyscf", "pbc", "band-structure"]


[dependencies]
cubecl = "0.8.1"
log = "0.4"
thiserror = "1.0"
env_logger = { version = "0.11", optional = true }
rayon = "1.11.0"
bumpalo = { version = "3.19.0", features = ["collections"] }
bitvec = "1.0.1"
cubecl-reduce = "0.8.1"
cubecl-wgpu = "0.8.1"
cubecl-runtime = "0.8.1"
cubecl-cpu = "0.8.1"
cubecl-common = "0.8.1"
wgpu = { version = "26.0.1", optional = true }
pollster = { version = "0.3.0", optional = true }
futures-intrusive = { version = "0.5.0", optional = true }
bytemuck = { version = "1.16.0", features = ["derive"] }
anyhow = "1.0.100"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
criterion = "0.7.0"
smallvec = "1.15.1"
num-complex = "0.4"
cubecl-matmul = "0.8.1"
cubecl-core = "0.8.1"
cubecl-std = "0.8.1"
nalgebra = "0.32"

[features]
default = ["cpu-backend"]
cpu-backend = []
wgpu-backend = ["wgpu", "pollster", "futures-intrusive"]
cubecl-kernels = []
logging = ["env_logger"]

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
